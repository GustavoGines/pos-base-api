name: Backend CI Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    name: Run Feature Tests (SQLite in-memory)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3' # Versión estándar para Laravel 10/11
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, fileinfo
        coverage: none
        tools: composer:v2

    - name: Copy .env file
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate App Key
      run: php artisan key:generate

    - name: Run Tests
      # Corre la suite completa. phpunit.xml ya fuerza DB_CONNECTION=sqlite y DB_DATABASE=:memory:
      run: php artisan test --testsuite Feature
